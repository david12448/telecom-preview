<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>요금제 상세정보</title><style data-preview-style>
:root{--ink:#111827;--muted:#667085;--line:#e5e9f2;--bg:#f6f7fb;--brand:#26377d;--soft:#eef2ff;--warn:#fff7ed;--good:#eefbf5}
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}a{color:inherit;text-decoration:none}button,select{font:inherit}
.wrap{width:min(100%,980px);margin:auto;padding:22px 16px 72px}.hero,.panel,.post{background:#fff;border:1px solid var(--line);border-radius:22px}.hero{padding:28px 30px;background:linear-gradient(120deg,#f0f4ff,#fff 75%)}.eyebrow{font-size:12px;font-weight:900;color:#5364b4;letter-spacing:.06em}.hero h1{font-size:29px;line-height:1.35;letter-spacing:-.04em;margin:8px 0}.hero p{font-size:14px;color:#526079;line-height:1.65;margin:0}.demo{margin-top:15px;background:#fff5df;border:1px solid #f2d79d;color:#81560e;padding:10px 13px;border-radius:11px;font-size:12px;font-weight:750}.demo.live{background:#eefbf5;border-color:#bfe9d4;color:#145638}
.panel{padding:19px;margin-top:16px}.top-filters{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:12px;align-items:end}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}select{width:100%;border:1px solid #d7deea;border-radius:11px;padding:11px 13px;background:#fff;font-weight:750}.periods{display:flex;background:#f1f3f8;padding:4px;border-radius:11px;gap:4px}.period{flex:1;border:0;background:transparent;padding:9px 5px;border-radius:8px;color:#64748b;font-weight:850;cursor:pointer}.period.active{background:var(--brand);color:#fff}.extras{margin-top:11px}.extras summary{cursor:pointer;color:#394eb5;font-size:13px;font-weight:800}.advanced{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:10px}.note{font-size:12px;line-height:1.6;color:var(--muted);margin-top:11px}
.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 3px 11px;flex-wrap:wrap}.heading h2{font-size:19px;margin:0}.heading span{font-size:12px;color:var(--muted)}
.results,.review-results{display:grid;gap:9px}.result-link{display:block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 17px;box-shadow:0 4px 13px rgba(17,24,39,.025);transition:.16s}.result-link:hover{border-color:#c7d0ea;transform:translateY(-1px)}.mainline{display:grid;grid-template-columns:38px 58px minmax(0,1fr) auto 22px;align-items:center;gap:12px}.rank{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:#3949ab;font-weight:900}.plan-thumb{width:58px;height:58px;border-radius:13px;display:grid;place-items:center;text-align:center;padding:5px;background:#f3f5f9;border:1px solid #e7ebf2;color:#475569;font-size:11px;font-weight:900;line-height:1.25}.plan-thumb.oliveyoung{background:#f3fbe8;color:#365314}.plan-thumb.cu{background:#f5f3ff;color:#5b21b6}.plan-thumb.millie{background:#fff7ed;color:#9a3412}.plan-thumb.npay{background:#ecfdf3;color:#166534}.plan-thumb.daiso{background:#eff6ff;color:#1d4ed8}.plan-thumb.starbucks{background:#ecfdf5;color:#065f46}.plan-thumb.cgv{background:#fff1f2;color:#be123c}.plan-thumb.ediya{background:#eef2ff;color:#3730a3}.plan-thumb.book{background:#fefce8;color:#854d0e}.provider{font-size:12px;color:var(--muted);font-weight:750}.verify-mini{display:inline-flex;margin-left:7px;padding:2px 6px;border-radius:999px;font-size:10px;font-weight:850;vertical-align:1px}.verify-mini.ok{background:#eefbf5;color:#145638}.verify-mini.diff{background:#fff7ed;color:#9a5b08}.planname{font-size:16px;font-weight:900;line-height:1.5;margin:3px 0}.specs{font-size:12px;color:#5b6472;line-height:1.5}.price{text-align:right;min-width:150px}.price small{font-size:11px;color:var(--muted);display:block}.price strong{font-size:22px;letter-spacing:-.04em}.price span{display:block;font-size:12px;color:var(--muted);margin-top:3px}.arrow{font-size:21px;color:#94a3b8}.empty{background:#fff;border:1px dashed #cbd3e0;border-radius:16px;padding:34px;text-align:center;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;margin:2px 0 13px;font-size:13px;color:#526079;font-weight:800}.post{padding:28px}.post-head{border-bottom:1px solid var(--line);padding-bottom:20px}.crumb{font-size:12px;color:#667085;font-weight:750}.post h1{font-size:28px;line-height:1.35;letter-spacing:-.035em;margin:8px 0}.post-sub{font-size:14px;color:#526079;line-height:1.65}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}.chip{font-size:12px;background:#f2f5fa;padding:6px 9px;border-radius:999px;font-weight:750}.section{padding:22px 0;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}.section h2{font-size:18px;margin:0 0 13px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:#f6f8fb;border-radius:13px;padding:13px}.metric span{font-size:11px;color:var(--muted);display:block}.metric strong{display:block;font-size:19px;margin-top:5px}.metric.primary{background:#eef2ff}.metric.primary strong{color:#26377d}.spec-table{display:grid;grid-template-columns:150px 1fr;border-top:1px solid var(--line)}.spec-table div{padding:11px 3px;border-bottom:1px solid var(--line);font-size:13px}.spec-table .key{color:#667085;font-weight:750}.callout{padding:14px 15px;border-radius:13px;font-size:13px;line-height:1.65}.callout.warn{background:var(--warn);color:#86570f}.callout.good{background:var(--good);color:#145638}.cta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{display:inline-flex;justify-content:center;align-items:center;border:1px solid #d7deea;border-radius:11px;padding:11px 14px;background:#fff;font-size:13px;font-weight:850}.btn.primary{background:#111827;color:#fff;border-color:#111827}.btn.disabled{color:#94a3b8;background:#f8fafc;cursor:default}.disclaimer{font-size:11px;color:var(--muted);line-height:1.7;margin-top:15px}
@media(max-width:650px){.wrap{padding:11px 11px 48px}.hero{padding:22px 18px}.hero h1{font-size:24px}.panel{padding:15px}.top-filters{grid-template-columns:1fr}.advanced{grid-template-columns:1fr 1fr}.mainline{grid-template-columns:31px 48px minmax(0,1fr) 18px}.rank{width:31px;height:31px}.plan-thumb{width:48px;height:48px;font-size:10px}.price{grid-column:3;text-align:left;min-width:0;border-top:1px solid #f0f2f6;padding-top:8px;margin-top:3px}.arrow{grid-column:4;grid-row:1/3}.post{padding:20px 17px}.post h1{font-size:24px}.metrics{grid-template-columns:1fr}.spec-table{grid-template-columns:110px 1fr}}

.compare-rule{border:1px solid #dfe5f1;background:#f8faff;border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:3px}.compare-rule strong{font-size:12px;color:#475569}.compare-rule span{font-size:13px;font-weight:900;color:#26377d}.compare-rule small{font-size:11px;line-height:1.45;color:var(--muted)}
.price .promo-total{font-weight:850;color:#374151;margin-top:5px}.price .after-price{color:#7c4a03}.price-alert{display:inline-flex;margin-top:7px;padding:5px 8px;border-radius:9px;font-size:11px;font-weight:900;line-height:1.4}.price-alert.strong{background:#fff1e8;color:#a33b09;border:1px solid #ffd0b5}.price-alert.warn{background:#fff8e6;color:#8a5b00;border:1px solid #f4dd9b}
.price-special{margin-top:13px;padding:12px 14px;border-radius:12px;font-size:13px;font-weight:900;line-height:1.55}.price-special.strong{background:#fff1e8;color:#9a3412;border:1px solid #fdc9aa}.price-special.warn{background:#fff8e6;color:#854d0e;border:1px solid #eed99e}.metrics.two{grid-template-columns:repeat(2,1fr)}

@media(max-width:650px){.metrics.two{grid-template-columns:1fr}.compare-rule{padding:10px 11px}.price-alert{display:flex;width:fit-content}.price-special{font-size:12px}}


.planname,.provider,.price{overflow-wrap:anywhere}.mainline>div{min-width:0}
</style></head><body>
<main class="wrap">
<a class="back" id="backLink" href="./index.html">← 목록으로 돌아가기</a>
<article class="post" id="post">
  <div class="demo live">공식 홈페이지와 비교 채널을 교차검증한 실데이터입니다. 검증되지 않은 제휴혜택은 요금 순위에서 제외합니다.</div>
  <header class="post-head">
    <div class="crumb" id="crumb"></div>
    <h1 id="title">요금제 상세정보</h1>
    <div class="post-sub" id="subtitle"></div>
    <div class="price-special" id="priceSpecial" hidden></div>
    <div class="chips" id="chips"></div>
  </header>

  <section class="section">
    <h2>실제 요금 비교</h2>
    <div class="metrics two" id="costMetrics"></div>
    <p class="disclaimer">기본 비교는 3개월 총요금입니다. 두 번째 항목은 6개월·12개월 같은 고정값이 아니라 이 요금제의 실제 할인 적용기간을 그대로 계산합니다. 할인 종료 후에는 정상요금을 별도로 표시합니다.</p>
  </section>

  <section class="section">
    <h2>요금제 기본 정보</h2>
    <div class="spec-table" id="specTable"></div>
  </section>

  <section class="section">
    <h2>혜택</h2>
    <div class="callout good" id="benefit"></div>
    <p class="disclaimer">혜택은 요금과 별도로 표시합니다. 신청 여부·회선 유지조건·지급일은 가입 전 공식 페이지에서 확인하세요.</p>
  </section>

  <section class="section">
    <h2>꼭 확인할 유의사항</h2>
    <div class="callout warn" id="warning"></div>
    <div class="spec-table" id="conditionTable" style="margin-top:12px"></div>
  </section>

  <section class="section">
    <h2>출처 및 검증 상태</h2>
    <div class="spec-table" id="verification"></div>
    <div class="cta-row" id="sourceLinks"></div>
  </section>
</article>
</main>
<script src="./data.live.js"></script>
<script>
(()=>{"use strict";
const D=window.PLAN_FINDER_DATA,q=new URLSearchParams(location.search),id=q.get("id"),p=D.rows.find(x=>x.id===id),$=x=>document.getElementById(x),won=n=>n==null?"공식 검증 대기":new Intl.NumberFormat("ko-KR").format(n)+"원";
const backParams=new URLSearchParams();["profile","network","voice","sms","speed","brand"].forEach(k=>{if(q.has(k))backParams.set(k,q.get(k))});$("backLink").href="./index.html"+(backParams.toString()?"?"+backParams.toString():"");
if(!p){$("post").innerHTML='<div class="empty">요금제를 찾을 수 없습니다.<br><br><a class="btn" href="./index.html">목록으로 이동</a></div>';return}
document.title=p.name+" · 상세정보";
$("crumb").textContent=p.brand+" · "+p.network+"망 · "+(p.technology||"")+" · 요금제 상세";
$("title").textContent=p.name;
const dataText=(p.dataLabel||p.data+"GB"+(p.daily?" + 매일 "+p.daily+"GB":""))+(p.qos?" 소진 후 최대 "+p.qos+"Mbps":"");
const priceText=p.lifetime?"평생 월 "+won(p.promo):(p.ongoing||p.months==null)?"월 "+won(p.promo):"현재 할인요금 월 "+won(p.promo)+" · "+p.months+"개월 할인";
$("subtitle").textContent=dataText+" · "+priceText;
if(p.priceNotice){$("priceSpecial").hidden=false;$("priceSpecial").className="price-special "+(p.priceNotice.level||"warn");$("priceSpecial").textContent="⚠ "+p.priceNotice.label}
const voiceChip=p.voice==null?"통화 확인 필요":p.voice==="unlimited"?"통화 무제한":"통화 "+p.voice+"분";const smsChip=p.sms==null?"문자 확인 필요":p.sms==="unlimited"?"문자 무제한":"문자 "+p.sms+"건";const chipTexts=[p.network+"망",p.technology||"",p.category==="capped"?"데이터 제공량형":"데이터 무제한 계열",voiceChip,smsChip].filter(Boolean);
chipTexts.forEach(t=>{const s=document.createElement("span");s.className="chip";s.textContent=t;$("chips").append(s)});
const first=document.createElement("div");first.className="metric primary";first.innerHTML="<span>3개월 총요금 · 기본 비교</span><strong>"+won(p.costs&&p.costs["3"])+"</strong>";$("costMetrics").append(first);
const second=document.createElement("div");second.className="metric";
if(p.rankingEligible===false){second.innerHTML="<span>실제 할인기간 총요금</span><strong>공식 검증 대기</strong>"}
else if(p.lifetime){second.innerHTML="<span>평생요금</span><strong>월 "+won(p.promo)+"</strong>"}
else if(p.ongoing||p.months==null){second.innerHTML="<span>상시요금</span><strong>월 "+won(p.promo)+"</strong>"}
else{second.innerHTML="<span>"+p.months+"개월 할인 총요금</span><strong>"+won(p.costs&&p.costs.promo)+"</strong>"}
$("costMetrics").append(second);
function row(root,key,value){const a=document.createElement("div");a.className="key";a.textContent=key;const b=document.createElement("div");b.textContent=value;root.append(a,b)}
if(p.rankingEligible===false)row($("verification"),"관측 정보 범위","월요금·할인개월·사양은 외부 비교 채널 관측 값이며 공식 상세 검증 전 · 총요금 순위 제외");
row($("specTable"),p.rankingEligible===false?"관측 월요금":"현재 월요금",won(p.promo));
row($("specTable"),"할인 유지기간",p.lifetime?"평생":(p.ongoing||p.months==null)?"별도 할인기간 없음":p.months+"개월");
row($("specTable"),"할인 종료 후",p.lifetime?"평생 동일":(p.ongoing||p.months==null)?"동일 요금":won(p.after)+"/월");
row($("specTable"),"데이터",dataText);
row($("specTable"),"통화",p.voice==null?"세부 제공량 확인 필요":p.voice==="unlimited"?"무제한":p.voice+"분");
row($("specTable"),"문자",p.sms==null?"세부 제공량 확인 필요":p.sms==="unlimited"?"무제한":p.sms+"건");
if(p.additionalVoice)row($("specTable"),"영상/부가통화",p.additionalVoice+"분");
if(p.wifiFree)row($("specTable"),"Wi-Fi","무료");
$("benefit").textContent=(p.advertisedEffectivePrice!=null?"공식 광고상 혜택 체감가 월 "+won(p.advertisedEffectivePrice)+" · 순위 미반영 · ":"")+p.benefit;
$("warning").textContent="⚠ "+(p.priceNotice?p.priceNotice.label+" · ":"")+p.warning;
row($("conditionTable"),"요금 할인 조건",(p.priceConditionBadges&&p.priceConditionBadges.length)?p.priceConditionBadges.join(" · "):p.activation);
row($("conditionTable"),"혜택 조건",(p.benefitConditionBadges&&p.benefitConditionBadges.length)?p.benefitConditionBadges.join(" · "):(p.benefitLines&&p.benefitLines.length?"상세조건 추가 검증 필요":"별도 제휴혜택 없음"));
row($("conditionTable"),"혜택 반영 원칙","상품권·포인트·제휴할인은 총요금에서 차감하지 않음");
row($("verification"),"현재 상태",p.verification);
if(p.detailVerified)row($("verification"),"상세조건","공식 상세페이지 조건 검증 완료");
row($("verification"),"비교 기준","3개월 총요금 + 실제 할인 적용기간 총요금");
const mx=p.moyoCrosscheck||{};const compareText=!mx.matched?"외부 비교 채널 매칭 없음/추가 확인 필요":mx.priceStatus==="needs_official_detail_review"?"공식 이름·주변 가격 관측 · 기간/사양 검증 대기":mx.priceStatus==="agree"?"외부 비교 채널과 가격·할인기간 일치":("외부 비교 채널과 차이 있음");row($("verification"),"가격 교차검증",compareText);
if((mx.specDiffs||[]).length)row($("verification"),"사양 검토 필요",mx.specDiffs.join(" · ")+" 차이 · 공식 정보를 기준으로 표시");
row($("verification"),"마지막 수집",D.updatedAt||"확인 중");
const sourceRoot=$("sourceLinks");const links=p.outboundLinks||[];links.forEach(link=>{const a=document.createElement("a");a.className="btn"+(link.source==="official"?" primary":"");a.href=link.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=link.label+" ↗";sourceRoot.append(a)});
})();
</script></body></html>
