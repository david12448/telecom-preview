<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>요금제 상세정보</title><link rel="stylesheet" href="./styles.css"></head><body>
<main class="wrap">
<a class="back" id="backLink" href="./index.html">← 목록으로 돌아가기</a>
<article class="post" id="post">
  <div class="demo live">공식 홈페이지와 모요를 교차검증한 실데이터입니다. 조건이 검증되지 않은 제휴혜택은 요금 순위에서 제외합니다.</div>
  <header class="post-head">
    <div class="crumb" id="crumb"></div>
    <h1 id="title">요금제 상세정보</h1>
    <div class="post-sub" id="subtitle"></div>
    <div class="chips" id="chips"></div>
  </header>

  <section class="section">
    <h2>기간별 실제 요금</h2>
    <div class="metrics" id="costMetrics"></div>
    <p class="disclaimer">할인기간이 끝나는 경우 이후 정상요금을 자동으로 합산합니다. 실제 서비스에서는 검증된 가입비·유심비·확정 현금성 혜택도 함께 계산합니다.</p>
  </section>

  <section class="section">
    <h2>요금제 기본 정보</h2>
    <div class="spec-table" id="specTable"></div>
  </section>

  <section class="section">
    <h2>혜택</h2>
    <div class="callout good" id="benefit"></div>
    <p class="disclaimer">별도 신청, 유지조건, 지급일이 필요한 혜택은 기본 순위에서 자동 차감하지 않는 방향으로 설계합니다.</p>
  </section>

  <section class="section">
    <h2>꼭 확인할 유의사항</h2>
    <div class="callout warn" id="warning"></div>
    <div class="spec-table" id="conditionTable" style="margin-top:12px"></div>
  </section>

  <section class="section">
    <h2>출처 및 검증 상태</h2>
    <div class="spec-table" id="verification"></div>
    <div class="cta-row" id="sourceLinks"></div>
  </section>
</article>
</main>
<script src="./data.live.js"></script>
<script>
(()=>{"use strict";
const D=window.PLAN_FINDER_DATA, q=new URLSearchParams(location.search), id=q.get("id"), p=D.rows.find(x=>x.id===id), $=x=>document.getElementById(x), won=n=>new Intl.NumberFormat("ko-KR").format(n)+"원";
const total=(plan,m)=>{
  if(plan.costs&&Number.isFinite(plan.costs[String(m)]))return plan.costs[String(m)];
  if(plan.lifetime||plan.months==null)return plan.promo*m;
  return Math.min(m,plan.months)*plan.promo+Math.max(0,m-plan.months)*plan.after;
};
const selected=[3,6,12].includes(Number(q.get("months")))?Number(q.get("months")):3;
const backParams=new URLSearchParams();["profile","network","voice","sms","speed","brand","months"].forEach(k=>{if(q.has(k))backParams.set(k,q.get(k))});$("backLink").href="./index.html"+(backParams.toString()?"?"+backParams.toString():"");
if(!p){$("post").innerHTML='<div class="empty">요금제를 찾을 수 없습니다.<br><br><a class="btn" href="./index.html">목록으로 이동</a></div>';return}
document.title=p.name+" · 상세정보";
$("crumb").textContent=p.brand+" · "+p.network+"망 · "+(p.technology||"")+" · 요금제 상세";
$("title").textContent=p.name;
const dataText=(p.dataLabel||p.data+"GB"+(p.daily?" + 매일 "+p.daily+"GB":""))+(p.qos?" 소진 후 최대 "+p.qos+"Mbps":"");
const priceText=p.lifetime?"평생 월 "+won(p.promo):(p.ongoing||p.months==null)?"월 "+won(p.promo):"현재 할인요금 월 "+won(p.promo)+" · "+p.months+"개월 할인";
$("subtitle").textContent=dataText+" · "+priceText;
const voiceChip=p.voice==null?"통화 확인 필요":p.voice==="unlimited"?"통화 무제한":"통화 "+p.voice+"분";const smsChip=p.sms==null?"문자 확인 필요":p.sms==="unlimited"?"문자 무제한":"문자 "+p.sms+"건";const chipTexts=[p.network+"망",p.technology||"",p.category==="capped"?"데이터 제공량형":"데이터 무제한 계열",voiceChip,smsChip].filter(Boolean);
chipTexts.forEach(t=>{const s=document.createElement("span");s.className="chip";s.textContent=t;$("chips").append(s)});
[3,6,12].forEach(m=>{const box=document.createElement("div");box.className="metric"+(m===selected?" primary":"");box.innerHTML="<span>"+m+"개월 총요금"+(m===selected?" · 현재 선택":"")+"</span><strong>"+won(total(p,m))+"</strong>";$("costMetrics").append(box)});
function row(root,key,value){const a=document.createElement("div");a.className="key";a.textContent=key;const b=document.createElement("div");b.textContent=value;root.append(a,b)}
row($("specTable"),"현재 월요금",won(p.promo));
row($("specTable"),"할인 유지기간",p.lifetime?"평생":(p.ongoing||p.months==null)?"별도 할인기간 없음":p.months+"개월");
row($("specTable"),"할인 종료 후",p.lifetime?"평생 동일":(p.ongoing||p.months==null)?"동일 요금":won(p.after)+"/월");
row($("specTable"),"데이터",dataText);
row($("specTable"),"통화",p.voice==null?"세부 제공량 확인 필요":p.voice==="unlimited"?"무제한":p.voice+"분");
row($("specTable"),"문자",p.sms==null?"세부 제공량 확인 필요":p.sms==="unlimited"?"무제한":p.sms+"건");
if(p.additionalVoice)row($("specTable"),"영상/부가통화",p.additionalVoice+"분");
if(p.wifiFree)row($("specTable"),"Wi-Fi","무료");
$("benefit").textContent=(p.advertisedEffectivePrice!=null?"공식 광고상 혜택 체감가 월 "+won(p.advertisedEffectivePrice)+" · 순위 미반영 · ":"")+p.benefit;
$("warning").textContent="⚠ "+p.warning;
row($("conditionTable"),"요금 할인 조건",(p.priceConditionBadges&&p.priceConditionBadges.length)?p.priceConditionBadges.join(" · "):p.activation);
row($("conditionTable"),"혜택 조건",(p.benefitConditionBadges&&p.benefitConditionBadges.length)?p.benefitConditionBadges.join(" · "):(p.benefitLines&&p.benefitLines.length?"상세조건 추가 검증 필요":"별도 제휴혜택 없음"));
row($("conditionTable"),"혜택 반영 원칙",p.benefitEffectiveCostEligible?"검증된 확정혜택만 비용에 반영":"상품권·포인트·제휴할인은 기본 순위 비용에서 차감하지 않음");
row($("verification"),"현재 상태",p.verification);
if(p.detailVerified)row($("verification"),"상세조건","공식 상세페이지 조건 검증 완료");
row($("verification"),"비교 기준","공식 요금·할인기간·할인 종료 후 요금");
const mx=p.moyoCrosscheck||{};const moyoText=!mx.matched?"모요 매칭 없음/추가 확인 필요":mx.priceStatus==="agree"?"모요와 가격·할인기간 일치":("모요와 차이 있음 ("+(mx.priceDiffs||[]).join(", ")+")");row($("verification"),"모요 교차검증",moyoText);
row($("verification"),"마지막 수집",D.updatedAt||"확인 중");
const sourceRoot=$("sourceLinks");const links=p.outboundLinks||[];links.forEach(link=>{const a=document.createElement("a");a.className="btn"+(link.source==="official"?" primary":"");a.href=link.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=link.label+" ↗";sourceRoot.append(a)});if(!links.some(x=>x.source==="ajung")){const s=document.createElement("span");s.className="btn disabled";s.textContent="아정당 동일 요금제 확인 중";sourceRoot.append(s)}
})();
</script></body></html>
